<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 230" width="180" height="230"
     role="img" aria-label="집을 지어 주는 요정">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a3160"/><stop offset="34%" stop-color="#5e4779"/>
    <stop offset="62%" stop-color="#a06a83"/><stop offset="84%" stop-color="#dd8f6e"/>
    <stop offset="100%" stop-color="#f3bc80"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="46%" r="52%">
    <stop offset="0%" stop-color="#ffe6ab" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#ffe6ab" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#cfe9e2" stop-opacity=".78"/>
    <stop offset="100%" stop-color="#9fd3c8" stop-opacity=".30"/>
  </linearGradient>
</defs>

<rect width="180" height="230" fill="url(#sky)"/>
<ellipse cx="90" cy="104" rx="86" ry="82" fill="url(#halo)"/>

<!-- 별 -->
<g fill="#fff6e2">
  <circle cx="26" cy="26" r="1.6"/><circle cx="52" cy="14" r="1.1"/>
  <circle cx="148" cy="22" r="1.7"/><circle cx="126" cy="44" r="1"/>
  <circle cx="18" cy="58" r="1.2"/><circle cx="162" cy="62" r="1.3"/>
  <circle cx="72" cy="30" r="1"/><circle cx="106" cy="16" r="1.2"/>
</g>

<!-- 언덕 -->
<path d="M0 196 Q46 186 90 192 Q136 198 180 188 L180 230 L0 230 Z" fill="#6b5068"/>
<path d="M0 196 Q46 186 90 192 Q136 198 180 188" fill="none" stroke="#8e6f95" stroke-width="2"/>
<g fill="none" stroke="#8e6f95" stroke-width="2" stroke-linecap="round">
  <path d="M14 193 v-7 M30 195 v-5 M148 190 v-7 M164 189 v-6"/>
</g>

<!-- 날개 -->
<g opacity=".9">
  <path d="M74 118 C46 100 40 74 58 68 C74 63 80 88 76 112 Z" fill="url(#wing)"
        stroke="#bfe2d9" stroke-width="1.2"/>
  <path d="M106 118 C134 100 140 74 122 68 C106 63 100 88 104 112 Z" fill="url(#wing)"
        stroke="#bfe2d9" stroke-width="1.2"/>
</g>

<!-- 몸 -->
<ellipse cx="80" cy="194" rx="9" ry="4.5" fill="#6b4429"/>
<ellipse cx="100" cy="194" rx="9" ry="4.5" fill="#6b4429"/>
<path d="M68 122 h44 l7 70 h-58 Z" fill="#4f8f86" stroke="#3a6d66" stroke-width="1.6"
